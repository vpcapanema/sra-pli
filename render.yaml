services:
  - type: web
    name: sra-pli-starter
    runtime: docker
    # Standard = 2 GB RAM / 1 CPU. Starter e Free = 512 MB (WeasyPrint + app estouram).
    # Tarifa: docs.render.com/pricing — exige metodo de pagamento no workspace Render.
    plan: standard
    region: oregon
    healthCheckPath: /health
    envVars:
      # DB vive em Virginia (Oregon foi descontinuado). URL gerenciada manualmente
      # via painel/API do Render para evitar que o blueprint sobrescreva.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@concremat.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ENV
        value: production
      # Cookie de sessao com Secure (obrigatorio em HTTPS).
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # ---- Notificacoes mensais (Track 5: cron) ----
      # Preencha SENDGRID_API_KEY no painel do Render (sync: false). Sem chave,
      # o servico opera em sandbox (renderiza email mas nao envia).
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        value: no-reply@concremat.local
      - key: SENDGRID_FROM_NAME
        value: "SRA · PLI-SP"
      - key: APP_BASE_URL
        value: https://sra-pli-starter.onrender.com
      - key: NOTIFICAR_HABILITADO
        value: "true"
      - key: NOTIFICAR_SANDBOX
        value: "false"
      # Token do Event Webhook do SendGrid para registrar delivered/open/bounce.
      - key: SENDGRID_EVENT_WEBHOOK_TOKEN
        sync: false
      # Token compartilhado dos endpoints /admin/cron/* (string longa aleatoria).
      - key: CRON_TOKEN
        sync: false
      # Chave da API do cron-job.org usada apenas para exibir status dos jobs.
      - key: CRONJOB_ORG_API_KEY
        sync: false

