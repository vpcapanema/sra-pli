[tool.pylint.MASTER]
ignore = [".venv", "venv", "_extracted_text", "relatorios_entregues"]
extension-pkg-allow-list = ["pydantic", "bcrypt"]

[tool.pylint.TYPECHECK]
ignored-modules = [
    "alembic.context",
]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "import-error",
    "no-name-in-module",
    "line-too-long",
    "broad-exception-caught",
    "broad-except",
    "too-few-public-methods",
    "unused-argument",
    "invalid-name",
    "fixme",
    "wrong-import-order",
    "wrong-import-position",
    "import-outside-toplevel",
    "multiple-imports",
    "multiple-statements",
    "trailing-whitespace",
    "unused-import",
    "unused-variable",
    "raise-missing-from",
    "cell-var-from-loop",
    "too-many-arguments",
    "too-many-positional-arguments",
]

[tool.pylint.FORMAT]
max-line-length = 120

[tool.pyright]
typeCheckingMode = "off"
useLibraryCodeForTypes = true
reportMissingImports = "none"
reportMissingModuleSource = "none"

[tool.flake8]
max-line-length = 120
extend-ignore = ["E501", "E402", "W503", "E203"]
exclude = [".venv", "venv", "_extracted_text", "relatorios_entregues"]

# Formatacao Python no editor (extensao Ruff) e CLI: `ruff format app scripts`.
# Saida compativel com estilo Black; linha 120 alinhada ao flake8/pylint acima.
[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    "venv",
    "_extracted_text",
    "relatorios_entregues",
]

[tool.ruff.format]
quote-style = "double"
