[tool.pylint.MASTER]
ignore = [".venv", "venv", "_extracted_text", "relatorios_entregues"]
extension-pkg-allow-list = ["pydantic", "bcrypt"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "import-error",
    "no-name-in-module",
    "line-too-long",
    "broad-exception-caught",
    "broad-except",
    "too-few-public-methods",
    "unused-argument",
    "invalid-name",
    "fixme",
    "wrong-import-order",
    "wrong-import-position",
    "import-outside-toplevel",
    "multiple-imports",
    "multiple-statements",
    "trailing-whitespace",
    "unused-import",
    "unused-variable",
    "raise-missing-from",
    "cell-var-from-loop",
]

[tool.pylint.FORMAT]
max-line-length = 120

[tool.pyright]
typeCheckingMode = "off"
useLibraryCodeForTypes = true
reportMissingImports = "none"
reportMissingModuleSource = "none"

[tool.flake8]
max-line-length = 120
extend-ignore = ["E501", "E402", "W503", "E203"]
exclude = [".venv", "venv", "_extracted_text", "relatorios_entregues"]

[tool.djlint]
profile = "jinja"
extension = "html"
exclude = ".venv,venv,.github,_extracted_text,relatorios_entregues,__pycache__,node_modules,app/pdf_render.py,tmp"
ignore = "H006,H013,H014,H016,H017,H019,H020,H021,H022,H023,H026,H030,H031,H037,H040,H047,T003,J004,J018"
indent = 2
max_line_length = 200
max_attribute_length = 200
