{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block auth %}
  <div class="login-card">
    <h1>SRA · PLI-SP</h1>
    <p class="lede">
      Sistema de Relatórios de Atividades
      <br>
      Consórcio Concremat–Transplan
    </p>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    {% if notice %}<div class="alert alert-ok">{{ notice }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="login-email">E-mail</label>
      <input id="login-email" type="email" name="email" title="E-mail" placeholder="voce@empresa.com" required autofocus autocomplete="username" value="{{ email_preenchido or '' }}" />
      <label for="login-role">Perfil</label>
      <select id="login-role" name="role" title="Perfil com que vai iniciar sessão" required>
        <option value="" disabled {% if not role %}selected{% endif %}>— selecione —</option>
        <option value="autor" {% if role == 'autor' %}selected{% endif %}>Autor</option>
        <option value="coordenador" {% if role == 'coordenador' %}selected{% endif %}>Coordenador</option>
        <option value="admin" {% if role == 'admin' %}selected{% endif %}>Administrador</option>
      </select>
      <label for="login-password">Senha</label>
      <div class="login-password-row">
        <input id="login-password" type="password" name="password" title="Senha" placeholder="sua senha" required autocomplete="current-password" />
        <button type="button" class="btn-show-pw" id="login-toggle-pw" aria-controls="login-password" aria-pressed="false" title="Mostrar senha">Mostrar</button>
      </div>
      <button type="submit">Entrar</button>
    </form>
    <p class="login-extra">
      <a class="login-forgot-link" href="/recuperar-senha">Esqueci minha senha</a>
    </p>
    <script>
(function () {
  const inp = document.getElementById("login-password");
  const btn = document.getElementById("login-toggle-pw");
  if (!inp || !btn) return;
  btn.addEventListener("click", function () {
    const show = inp.type === "password";
    inp.type = show ? "text" : "password";
    btn.setAttribute("aria-pressed", show ? "true" : "false");
    btn.textContent = show ? "Ocultar" : "Mostrar";
    btn.title = show ? "Ocultar senha" : "Mostrar senha";
  });
})();
    </script>
  </div>
{% endblock %}
