<div id="sra-cpl-status-ok" class="sra-cpl-wrap is-hidden" role="dialog" aria-modal="true" aria-labelledby="sra-cpl-status-ok-title">
  <div class="sra-cpl-box sra-cpl-box--md">
    <div class="sra-cpl-hdr sra-cpl-hdr--ok">
      <strong id="sra-cpl-status-ok-title" class="sra-cpl-title">Operação concluída</strong>
    </div>
    <div class="sra-cpl-body sra-cpl-body--stacked">
      <p id="sra-cpl-status-ok-message" class="sra-cpl-msg">Síntese do resultado, em voz ativa, sem jargão desnecessário.</p>
      <div id="sra-cpl-status-ok-detail-wrap" class="sra-cpl-slot sra-cpl-slot--detail is-hidden" aria-hidden="true">
        <span class="sra-cpl-slot-lbl">Detalhe</span>
        <p id="sra-cpl-status-ok-detail" class="sra-cpl-slot-txt">Informação suplementar (identificadores, totais) quando fizer sentido.</p>
      </div>
    </div>
    <div class="sra-cpl-actions sra-cpl-actions--single">
      <button type="button" id="sra-cpl-status-ok-btn" class="sra-cpl-ok">Entendi</button>
    </div>
  </div>
</div>
