{% extends "base.html" %}
{% block title %}Nova senha{% endblock %}
{% block auth %}
  <div class="login-card">
    <h1>Nova senha</h1>
    <p class="lede">Defina uma nova senha para a conta confirmada no passo anterior.</p>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/recuperar-senha/definir">
      <label for="def-password">Nova senha</label>
      <div class="login-password-row">
        <input id="def-password" type="password" name="password" title="Nova senha" placeholder="mínimo 6 caracteres" required minlength="6" autocomplete="new-password" />
        <button type="button" class="btn-show-pw" id="def-toggle-pw1" aria-controls="def-password" aria-pressed="false" title="Mostrar senha">Mostrar</button>
      </div>
      <label for="def-password2">Confirmar senha</label>
      <div class="login-password-row">
        <input id="def-password2" type="password" name="password2" title="Confirmar senha" placeholder="repita a senha" required minlength="6" autocomplete="new-password" />
        <button type="button" class="btn-show-pw" id="def-toggle-pw2" aria-controls="def-password2" aria-pressed="false" title="Mostrar senha">Mostrar</button>
      </div>
      <button type="submit">Guardar nova senha</button>
    </form>
    <p class="login-extra">
      <a class="login-forgot-link" href="/login">Voltar ao login</a>
    </p>
    <script>
(function () {
  function bindToggle(btnId, inputId) {
    const inp = document.getElementById(inputId);
    const btn = document.getElementById(btnId);
    if (!inp || !btn) return;
    btn.addEventListener("click", function () {
      const show = inp.type === "password";
      inp.type = show ? "text" : "password";
      btn.setAttribute("aria-pressed", show ? "true" : "false");
      btn.textContent = show ? "Ocultar" : "Mostrar";
      btn.title = show ? "Ocultar senha" : "Mostrar senha";
    });
  }
  bindToggle("def-toggle-pw1", "def-password");
  bindToggle("def-toggle-pw2", "def-password2");
})();
    </script>
  </div>
{% endblock %}
