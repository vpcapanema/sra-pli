<div id="sra-cpl-confirm" class="sra-cpl-wrap is-hidden" role="dialog" aria-modal="true" aria-labelledby="sra-cpl-confirm-title">
  <div class="sra-cpl-box sra-cpl-box--md">
    <div class="sra-cpl-hdr">
      <strong id="sra-cpl-confirm-title" class="sra-cpl-title">Confirmar processo</strong>
    </div>
    <div class="sra-cpl-body">
      <p id="sra-cpl-confirm-lead" class="sra-cpl-lead">Resumo do processo que será executado.</p>
      <p id="sra-cpl-confirm-lead-source" class="sra-cpl-lead-source is-hidden" aria-hidden="true"></p>
      <div id="sra-cpl-confirm-detail-wrap" class="sra-cpl-slot sra-cpl-slot--detail is-hidden" aria-hidden="true">
        <span class="sra-cpl-slot-lbl">Detalhe</span>
        <p id="sra-cpl-confirm-detail" class="sra-cpl-slot-txt">Informação suplementar sobre efeitos, duração ou irreversibilidade, quando couber.</p>
      </div>
      <p id="sra-cpl-confirm-ask" class="sra-cpl-ask">Deseja continuar?</p>
    </div>
    <div class="sra-cpl-actions">
      <button type="button" id="sra-cpl-confirm-cancel" class="secondary">Cancelar</button>
      <button type="button" id="sra-cpl-confirm-ok" class="sra-cpl-ok">Continuar</button>
    </div>
  </div>
</div>
