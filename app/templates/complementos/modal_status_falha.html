<div id="sra-cpl-status-fail" class="sra-cpl-wrap is-hidden" role="dialog" aria-modal="true" aria-labelledby="sra-cpl-status-fail-title">
  <div class="sra-cpl-box sra-cpl-box--md">
    <div class="sra-cpl-hdr sra-cpl-hdr--danger">
      <strong id="sra-cpl-status-fail-title" class="sra-cpl-title">Operação interrompida</strong>
    </div>
    <div class="sra-cpl-body sra-cpl-body--stacked">
      <p id="sra-cpl-status-fail-error" class="sra-cpl-msg sra-cpl-msg--err">Síntese do impedimento, sem atribuição de culpa ao utilizador.</p>
      <div id="sra-cpl-status-fail-detail-wrap" class="sra-cpl-slot sra-cpl-slot--detail is-hidden" aria-hidden="true">
        <span class="sra-cpl-slot-lbl">Detalhe</span>
        <p id="sra-cpl-status-fail-detail" class="sra-cpl-slot-txt">Causa ou código legível, apenas se favorecer a correção imediata.</p>
      </div>
      <div class="sra-cpl-hint">
        <span class="sra-cpl-hint-lbl">O que fazer</span>
        <p id="sra-cpl-status-fail-hint" class="sra-cpl-hint-txt">Encaminhamento objetivo: verificações, novo envio ou pedido de apoio.</p>
      </div>
    </div>
    <div class="sra-cpl-actions sra-cpl-actions--single">
      <button type="button" id="sra-cpl-status-fail-btn" class="sra-cpl-ok">Entendi</button>
    </div>
  </div>
</div>
