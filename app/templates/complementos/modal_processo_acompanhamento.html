<div id="sra-cpl-track" class="sra-cpl-wrap is-hidden" role="dialog" aria-modal="true" aria-labelledby="sra-cpl-track-title">
  <div class="sra-cpl-box sra-cpl-box--lg">
    <div class="sra-cpl-hdr sra-cpl-hdr--bar">
      <div class="sra-cpl-hdr-titles">
        <strong id="sra-cpl-track-title" class="sra-cpl-title">Acompanhamento do processo</strong>
        <p id="sra-cpl-track-sub" class="sra-cpl-track-sub is-hidden" aria-hidden="true"></p>
      </div>
      <button type="button" id="sra-cpl-track-close" class="sra-cpl-x" aria-label="Fechar">×</button>
    </div>
    <div class="sra-cpl-body sra-cpl-body--flush sra-cpl-body--track">
      <p class="sra-cpl-log-hint">
        Exibe-se uma única linha de estado por vez, em voz ativa, sem registos técnicos brutos. Abaixo, o avanço percentual
        acompanha a etapa em curso e o fluxo completo, em incrementos de 1&nbsp;%.
      </p>
      <div id="sra-cpl-now" class="sra-cpl-now" aria-live="polite">
        <span class="sra-cpl-now-lbl">Tarefa atual</span>
        <p id="sra-cpl-now-tarefa" class="sra-cpl-now-tarefa">—</p>
        <div id="sra-cpl-now-sub-wrap" class="sra-cpl-now-sub-wrap is-hidden" aria-hidden="true">
          <span class="sra-cpl-now-lbl">Etapa</span>
          <p id="sra-cpl-now-sub" class="sra-cpl-now-sub"></p>
        </div>
        <div class="sra-cpl-now-msgbox">
          <p id="sra-cpl-now-msg" class="sra-cpl-now-msg">—</p>
        </div>
      </div>
      <div class="sra-cpl-prog">
        <div class="sra-cpl-prog-block">
          <div class="sra-cpl-prog-top">
            <span id="sra-cpl-prog-lbl-tarefa" class="sra-cpl-prog-legend">Progresso desta tarefa</span>
            <span id="sra-cpl-pct-tarefa" class="sra-cpl-prog-pct" aria-hidden="true">0%</span>
          </div>
          <div id="sra-cpl-bar-tarefa" class="sra-cpl-bar" role="progressbar" aria-labelledby="sra-cpl-prog-lbl-tarefa" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="sra-cpl-bar-tarefa-fill" class="sra-cpl-bar-fill"></div>
          </div>
        </div>
        <div class="sra-cpl-prog-block sra-cpl-prog-block--geral">
          <div class="sra-cpl-prog-top">
            <span id="sra-cpl-prog-lbl-geral" class="sra-cpl-prog-legend">Progresso geral do fluxo</span>
            <span id="sra-cpl-pct-geral" class="sra-cpl-prog-pct" aria-hidden="true">0%</span>
          </div>
          <div id="sra-cpl-bar-geral" class="sra-cpl-bar" role="progressbar" aria-labelledby="sra-cpl-prog-lbl-geral" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="sra-cpl-bar-geral-fill" class="sra-cpl-bar-fill sra-cpl-bar-fill--geral"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
