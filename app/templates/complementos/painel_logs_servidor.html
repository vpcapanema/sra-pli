<section class="ss active-tab sra-live-log-section{% if sra_logs_altura == 'alta' %} sra-live-log-section--tall{% endif %}" id="ss-logs-servidor" aria-label="Registro do servidor em tempo real">
  <div class="ss-hdr">
    <span class="sn">◎</span><span class="st">Registro do servidor (tempo real)</span>
  </div>
  <div class="sb2 sra-live-log-card">
    <p class="sdesc sdesc-tight sra-live-log-hint">
      Fluxo contínuo do canal <code>/processos/eventos</code>: pedidos HTTP instrumentados, mensagens
      <code>logging</code> do Python (<code>uvicorn</code>, <code>app…</code>) e etapas de processo já ligadas ao SSE.
    </p>
    <div class="sra-live-log-toolbar">
      <button type="button" class="secondary" id="sra-live-log-clear">Limpar visão</button>
      <button type="button" class="secondary" id="sra-live-log-pause">Pausar</button>
      <span class="sra-live-log-status" id="sra-live-log-status" aria-live="polite">A receber…</span>
    </div>
    <pre class="sra-live-log-body" id="sra-live-log-body" role="log" aria-label="Texto do registro"></pre>
  </div>
</section>
