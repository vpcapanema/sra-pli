<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="format-detection" content="telephone=no,address=no,email=no,date=no">
    <title>{{ assunto }}</title>
    <!--[if mso]>
    <style type="text/css">
      table,td,div,p,a {font-family:Arial,Helvetica,sans-serif !important;}
    </style>
    <![endif]-->
    <style>
      @media only screen and (max-width:600px) {
        .sra-email-shell {width:100% !important;max-width:100% !important;border-radius:0 !important;}
        .sra-email-pad {padding:16px !important;}
        .sra-email-h {padding:14px 16px !important;}
        .sra-email-h-tit {font-size:16px !important;}
        .sra-email-paragrafo {font-size:13.5px !important;line-height:1.5 !important;}
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background:#eef1f5;font-family:Arial,Helvetica,sans-serif;color:#1a1a2e;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#eef1f5;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" class="sra-email-shell" width="600" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;border:1px solid #d5dce6;border-radius:6px;width:600px;max-width:100%;">
            <tr>
              <td class="sra-email-h" style="background:#1c3d59;color:#ffffff;padding:18px 22px;border-top-left-radius:6px;border-top-right-radius:6px;">
                <div style="font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:#3ec26e;font-weight:700;">SRA · PLI-SP</div>
                <div class="sra-email-h-tit" style="font-size:18px;font-weight:700;margin-top:4px;">{{ assunto }}</div>
              </td>
            </tr>
            <tr>
              <td class="sra-email-pad sra-email-paragrafo" style="padding:22px;font-size:14px;line-height:1.55;text-align:justify;border-bottom-left-radius:6px;border-bottom-right-radius:6px;">
                <p style="margin:0 0 12px;text-align:justify;">Olá, <strong>{{ destinatario_nome }}</strong>.</p>

                <div style="margin:0 0 12px;text-align:justify;">
                  {{ corpo_mensagem|safe }}
                </div>

                {% if link_relatorio_painel %}
                <p style="margin:18px 0 12px;text-align:justify;">
                  Para acessar o relatório, clique aqui:
                  <a href="{{ link_relatorio_painel }}" style="color:#116593;text-decoration:underline;font-weight:700;">{{ link_relatorio_painel }}</a>
                </p>
                {% endif %}

                <hr style="border:0;border-top:1px solid #d5dce6;margin:22px 0 14px;">

                <p style="margin:0 0 6px;font-size:11.5px;color:#4f5d6e;text-align:justify;">
                  Esta é uma mensagem personalizada enviada pelo coordenador do relatório.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
